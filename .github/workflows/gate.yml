name: gate

# The shelf polices itself. An agent-facing catalog with a dead link, a missing proof, a duplicate
# id, or a price-shaped field is refused — on every push, and weekly, so shelf rot is caught even
# when nothing changes here.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: catalog gate with liveness
        run: node tools/check-catalog.mjs --live

  # Reference certification #1 of the proven-shelf kit (the estate's catalog gate, generalised and
  # packaged for any storefront). mode=check: the committed shelf-receipt.json must REPRODUCE from
  # the live catalog on this runner — a certification is a standing claim, not a memory of a pass.
  proven-shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: certification must reproduce (proven-shelf gate)
        uses: sjgant80-hub/proven-shelf@main
        with:
          mode: check
          live: 'true'
